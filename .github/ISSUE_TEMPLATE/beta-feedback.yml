name: Beta feedback
description: Report a beta problem without posting private health data.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Never post health archives or readings, credentials,
        tokens, destination addresses, device identifiers, or unredacted logs/screenshots.
        Prefer the synthetic beta demo. Keep medical details out of the report.
  - type: input
    id: build
    attributes:
      label: App version and build
      placeholder: Version, build number, or release tag
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone / iPad
        - Mac
        - Android
        - Python receiver
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating-system version
      description: Do not include device serial numbers or account names.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Mention whether the synthetic demo reproduces it; omit personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Status labels and record counts are helpful; sample values are not needed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed health values, credentials, identifiers, and private destination details.
          required: true
